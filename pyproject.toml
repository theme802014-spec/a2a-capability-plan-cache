[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-plan-cache"
version = "0.3.0"
description = "Reference components for capability-aware Agent plan caching and incremental impact analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Independent project author"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
